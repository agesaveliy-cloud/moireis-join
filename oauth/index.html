<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Мой рейс</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1a2b;color:#e8eef7;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:420px;background:#16263d;border-radius:20px;padding:28px 24px;text-align:center}
h1{font-size:22px;margin:0 0 10px}
p{color:#9fb0c7;line-height:1.5;margin:0 0 20px}
a.btn{display:block;padding:15px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;background:#1055c9;color:#fff}
</style>
</head>
<body>
<main class="card">
<h1>Возвращаемся в «Мой рейс»</h1>
<p>Если приложение не открылось само, нажмите кнопку.</p>
<a id="open" class="btn" href="#">Открыть приложение</a>
</main>
<script>
// Возврат из Яндекса / Google / ВК: передаём код входа в приложение.
var url = 'intent://join.petrk1.ru/oauth/' + location.search +
'#Intent;scheme=https;package=ru.petrk1.moireis;end';
document.getElementById('open').href = url;
setTimeout(function () { location.href = url; }, 300);
</script>
</body>
</html>
